name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          VERSION=${{ steps.version.outputs.VERSION }}
          LDFLAGS="-s -w -X main.version=${VERSION}"

          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/discord-audio-bridge-linux-amd64

          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/discord-audio-bridge-linux-arm64

          # macOS AMD64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/discord-audio-bridge-darwin-amd64

          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/discord-audio-bridge-darwin-arm64

          # Windows AMD64 - with version info embedded
          go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

          # Parse version (strip 'v' prefix, default to 1.0.0)
          VERSION_NUM=${VERSION#v}
          MAJOR=$(echo $VERSION_NUM | cut -d. -f1)
          MINOR=$(echo $VERSION_NUM | cut -d. -f2)
          PATCH=$(echo $VERSION_NUM | cut -d. -f3)

          # Update versioninfo.json with actual version
          sed -i "s/\"Major\": 0/\"Major\": ${MAJOR:-1}/g" versioninfo.json
          sed -i "s/\"Minor\": 0/\"Minor\": ${MINOR:-0}/g" versioninfo.json
          sed -i "s/\"Patch\": 0/\"Patch\": ${PATCH:-0}/g" versioninfo.json
          sed -i "s/\"FileVersion\": \"\"/\"FileVersion\": \"${VERSION}\"/g" versioninfo.json
          sed -i "s/\"ProductVersion\": \"\"/\"ProductVersion\": \"${VERSION}\"/g" versioninfo.json

          # Generate resource.syso
          goversioninfo -o resource.syso versioninfo.json

          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/discord-audio-bridge-windows-amd64.exe

          # Clean up
          rm -f resource.syso

      - name: Create archives
        run: |
          VERSION=${{ steps.version.outputs.VERSION }}

          # Create release directories with all required files
          for platform in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            dir="discord-audio-bridge-${VERSION}-${platform}"
            mkdir -p "${dir}"
            cp "dist/discord-audio-bridge-${platform}" "${dir}/discord-audio-bridge"
            cp .env.example "${dir}/.env"
            cp -r static "${dir}/"
            cp README.md "${dir}/"
            cp start.sh "${dir}/"
            chmod +x "${dir}/start.sh"
            tar -czvf "dist/${dir}.tar.gz" "${dir}"
          done

          # Windows
          dir="discord-audio-bridge-${VERSION}-windows-amd64"
          mkdir -p "${dir}"
          cp dist/discord-audio-bridge-windows-amd64.exe "${dir}/discord-audio-bridge.exe"
          cp .env.example "${dir}/.env"
          cp -r static "${dir}/"
          cp README.md "${dir}/"
          cp start.bat "${dir}/"
          zip -r "dist/${dir}.zip" "${dir}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip

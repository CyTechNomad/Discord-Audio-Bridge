name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binaries
        run: |
          mkdir -p dist
          
          # Linux AMD64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/discord-audio-bridge-linux-amd64
          
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/discord-audio-bridge-linux-arm64
          
          # macOS AMD64 (Intel)
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/discord-audio-bridge-darwin-amd64
          
          # macOS ARM64 (Apple Silicon)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/discord-audio-bridge-darwin-arm64
          
          # Windows AMD64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/discord-audio-bridge-windows-amd64.exe

      - name: Create archives
        run: |
          cd dist
          
          # Create tar.gz for Unix platforms
          tar -czvf discord-audio-bridge-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz discord-audio-bridge-linux-amd64
          tar -czvf discord-audio-bridge-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz discord-audio-bridge-linux-arm64
          tar -czvf discord-audio-bridge-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz discord-audio-bridge-darwin-amd64
          tar -czvf discord-audio-bridge-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz discord-audio-bridge-darwin-arm64
          
          # Create zip for Windows
          zip discord-audio-bridge-${{ steps.version.outputs.VERSION }}-windows-amd64.zip discord-audio-bridge-windows-amd64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
